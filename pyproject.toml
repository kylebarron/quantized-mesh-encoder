[project]
name = "quantized-mesh-encoder"
version = "0.5.0"
description = "A fast Python Quantized Mesh encoder"
readme = "README.md"
authors = [{ name = "Kyle Barron", email = "kylebarron2@gmail.com" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
keywords = ["mesh", "heightmap", "elevation", "terrain", "numpy", "quantized-mesh"]
dependencies = ["numpy", "attrs"]

[project.urls]
Homepage = "https://github.com/kylebarron/quantized-mesh-encoder"
Repository = "https://github.com/kylebarron/quantized-mesh-encoder"
Issues = "https://github.com/kylebarron/quantized-mesh-encoder/issues"
Changelog = "https://github.com/kylebarron/quantized-mesh-encoder/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "quantized-mesh-tile>=0.7"]

[build-system]
# The Cython extension compiles against the numpy C headers, so numpy is
# needed at build time.
requires = ["cython>=3", "numpy>=2.0", "setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantized_mesh_encoder", "quantized_mesh_encoder.*"]

[tool.cibuildwheel]
skip = "cp38*"

[tool.ruff]
# React demo app deployed to gh-pages
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing comma; conflicts with ruff format
    "CPY001", # copyright header
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "FIX002", # todo statements
    "TD002",  # todo without author name
    "TRY003", # define exceptions in the exception class
]

[tool.ruff.lint.per-file-ignores]
"test/*" = [
    "INP001",  # no __init__.py: the `test` dir name would shadow the stdlib package
    "ANN001",  # annotation in function argument
    "ANN201",  # return type annotation
    "PLR2004", # Magic value used in comparison
    "S101",    # assert
    "SLF001",  # private member access
    "D",       # docstring
]
